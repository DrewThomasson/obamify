server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME type for WebAssembly
    types {
        application/wasm wasm;
    }

    # Required CORS headers for SharedArrayBuffer / web worker functionality
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Long-lived cache headers for static assets.
    # Note: nginx does not inherit add_header directives from parent blocks when
    # a location block defines its own add_header, so CORS headers are repeated here.
    location ~* \.(js|wasm|css|png|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # SPA routing — fall back to index.html for all unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
